<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirtazayev Blog | Articles </title>
    <meta property="og:title" content="Mirtazayev Blog | Articles">
    <meta property="og:description" content="Explore of Mirtazayev's Blog">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .back-button {
            @apply fixed top-4 left-4 flex items-center space-x-2 text-gray-600 hover:text-gray-900 transition-colors duration-300;
        }

        .article-card {
            @apply bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300;
            transform-origin: center;
        }

        .gradient-bg {
            @apply min-h-screen;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
    </style>
</head>
<body class="gradient-bg">
<div class="max-w-4xl mx-auto px-4 py-8">
    <a href="/blog" class="back-button">
        <i class="fas fa-arrow-left text-lg"></i>
        <span class="font-medium">Back to Blog</span>
    </a>

    <h1 class="text-5xl font-bold text-center mb-12 mt-20 text-gray-800 relative">
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">
                Latest Articles
            </span>
        <div class="absolute bottom-0 left-1/2 w-32 h-1 bg-blue-500 transform -translate-x-1/2"></div>
    </h1>

    {% if articles %}
        <div class="space-y-8">
            {% for article in articles %}
                <div class="article-card opacity-0 animate-fade-in"
                     style="animation-delay: {{ loop.index0 * 0.2 }}s;">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-2xl font-bold text-gray-800 pr-4">{{ article.title }}</h2>
                        <span class="text-sm text-gray-500 whitespace-nowrap">{{ article.date }}</span>
                    </div>
                    <div class="prose max-w-none text-gray-600 mb-4">
                        {{ article.content[:200] | safe }}...
                    </div>
                    <div class="flex items-center justify-between">
                        <a href="/blog/{{ article.slug }}"
                           class="group inline-flex items-center text-blue-600 hover:text-blue-800 transition-colors">
                            <span class="mr-2">Continue Reading</span>
                            <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-20">
            <div class="text-6xl mb-4 text-gray-300">
                <i class="fas fa-file-alt"></i>
            </div>
            <p class="text-xl text-gray-500">No articles published yet</p>
        </div>
    {% endif %}
</div>
</body>
</html>
