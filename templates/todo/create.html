<!-- create.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Todo</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        async function submitTodo(event) {
            event.preventDefault();

            const form = document.querySelector('.todo-form');
            const submitButton = form.querySelector('.create-btn');

            submitButton.textContent = "Creating...";
            submitButton.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch("/todo/create", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    window.location.href = "/todo";
                } else {
                    const errorData = await response.json();
                    alert("Error: " + (errorData.detail || "Failed to create todo."));
                    submitButton.textContent = "Create Todo"; // Revert button text
                    submitButton.disabled = false;
                }
            } catch (error) {
                console.error("Request failed:", error);
                alert("Something went wrong. Please try again.");
                submitButton.textContent = "Create Todo"; // Revert button text
                submitButton.disabled = false;
            }
        }
    </script>

</head>
<body>
<div class="container">
    <header class="header">
        <h1 class="title">Create New Todo</h1>
        <a href="/static" class="btn back-btn">← Back</a>
    </header>

    <form class="todo-form slide-up" onsubmit="submitTodo(event)">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" class="form-control">
                <option>Not Started</option>
                <option>Pending</option>
                <option>Done</option>
            </select>
        </div>
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" id="due_date" name="due_date" class="form-control">
        </div>
        <button type="submit" class="btn create-btn">Create Todo</button>
    </form>
</div>
</body>
</html>
